  overrides:
  - run.policy=dqn
  - run.sim_mode=multi
- config: configs/p7/binary.yaml
  out: reports/p7_actions/binary_eigthr
  overrides:
  - run.policy=eig_threshold
  - run.sim_mode=multi
- config: configs/p7/choice.yaml
  out: reports/p7_actions/choice_dqn
  overrides:
  - run.policy=dqn
  - run.sim_mode=multi
- config: configs/p7/choice.yaml
  out: reports/p7_actions/choice_eigthr
  overrides:
  - run.policy=eig_threshold
  - run.sim_mode=multi
- config: configs/p7/hier.yaml
