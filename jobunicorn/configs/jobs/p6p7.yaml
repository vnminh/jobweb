  overrides:
  - run.policy=eig_threshold
  - run.sim_mode=multi
- config: configs/p7/full.yaml
  out: reports/p7_actions/full_dqn
  overrides:
  - run.policy=dqn
  - run.sim_mode=multi
  - retrieval.n_c=2000
- config: configs/p7/full.yaml
  out: reports/p7_actions/full_eigthr
